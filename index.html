<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Disaster Management Quiz</title>
<style>
:root{--bg:#f5f7fa;--card:#fff;--ink:#1c2733;--mut:#5d6b7a;--ac:#0f5ea8;--acs:#e6f0fa;--ok:#2e7d4f;--no:#b3261e;--ln:#d9e0e8}
@media (prefers-color-scheme:dark){:root{--bg:#0f1720;--card:#18222e;--ink:#e8eef5;--mut:#9aa9b8;--ac:#5aa9f0;--acs:#1d3248;--ok:#5fc08a;--no:#ff8a80;--ln:#2b3a4a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:680px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.5rem;margin:.2em 0}.mut{color:var(--mut)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:20px;margin:14px 0}
label{display:block;font-weight:600;margin:14px 0 6px}
input[type=text]{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--ink);font:inherit}
input[type=text]:focus{outline:2px solid var(--ac);border-color:transparent}
button{font:inherit;cursor:pointer}
.go{padding:12px 22px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-weight:700}
.go:disabled{opacity:.5;cursor:not-allowed}
.sec{padding:11px 18px;border-radius:10px;border:1px solid var(--ln);background:var(--card);color:var(--ink)}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--ink)}
.opt:hover{border-color:var(--ac)}.opt.sel{border-color:var(--ac);background:var(--acs);font-weight:600}
.bar{height:6px;border-radius:3px;background:var(--ln);margin:8px 0 2px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);transition:width .25s}
.top{display:flex;justify-content:space-between;font-size:.9rem;color:var(--mut)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.dots button{width:32px;height:32px;border-radius:8px;border:1px solid var(--ln);background:var(--card);color:var(--ink);font-size:.8rem}
.dots button.a{background:var(--acs);border-color:var(--ac)}.dots button.c{outline:2px solid var(--ac)}
.err{color:var(--no);margin:10px 0;font-weight:600}.warn{padding:10px 12px;border-radius:10px;background:#fff3cd;color:#5c4400;margin:12px 0}
.done{text-align:center;padding:30px 10px}.done .big{font-size:3rem}
</style></head><body><main id="app"></main>
<script>
/* ================= SETTINGS ================= */
const API_URL = "https://script.google.com/macros/s/AKfycbzkq0dIFyJtkOeyaSRVgpu2gBBCvdjRrTg2jbJUA5M-eFFuAxhWo6uIXmibaapPQqPK6Q/exec";   // see SETUP.md
const QUIZ_TITLE = "Disaster Management Quiz";
const QUESTIONS_PER_STUDENT = 40;   // number of questions each student gets (max 40); order is always random
/* ============================================ */
const BANK = [{"id": "Q01", "q": "Risk-sensitive land use planning is best described as:", "o": ["A non-structural strategy that uses hazard information to steer development away from the most dangerous zones", "A structural strategy that relies on building dams and embankments", "A satellite service that monitors hazards in real time", "A relief programme that distributes aid after a disaster"]}, {"id": "Q02", "q": "How many stages are there in the ISO/ADPC process of integrating disaster risk reduction into land use planning?", "o": ["Seven", "Four", "Five", "Three"]}, {"id": "Q03", "q": "Which stage of risk-informed land use planning includes vulnerability indexing and SWOT analysis?", "o": ["Plan adoption", "Plan formulation", "Data analysis", "Preparation"]}, {"id": "Q04", "q": "Public hearing and submission of the report to the authorities belong to which stage?", "o": ["Plan formulation", "Data gathering", "Plan adoption", "Preparation"]}, {"id": "Q05", "q": "Which set lists the three things to consider in land use planning strategies for disaster risk reduction?", "o": ["Building dams, digging canals, and planting trees", "Maintaining natural systems, avoiding exposure to risk, and design and setting controls", "Issuing alerts, running drills, and training volunteers", "Raising funds, hiring staff, and printing maps"]}, {"id": "Q06", "q": "In land use planning, Gaps Analysis is used to:", "o": ["Count the number of buildings in a flood zone", "Estimate the cost of land near markets", "Compare the current situation with a set of desired resilience qualities", "Plot the tracks of past events on a map"]}, {"id": "Q07", "q": "Which of the following is a barrier to disaster-resilient land use planning?", "o": ["Development pressure", "Accurate knowledge of the extent of every hazard", "Complete public understanding of hazards", "Strong integration across sectors"]}, {"id": "Q08", "q": "According to UNDRR, structural measures are:", "o": ["Policies, laws and public awareness raising", "Insurance and financial contingency funds", "Agreements and training programmes only", "Any physical construction, or engineering technique, used to reduce or avoid the possible impacts of hazards"]}, {"id": "Q09", "q": "Which of these is a non-structural mitigation measure?", "o": ["Raising an embankment along a river", "Constructing a seawall", "Zoning that restricts building in high-risk areas", "Building a dam"]}, {"id": "Q10", "q": "Which of these is an engineered structural mitigation measure?", "o": ["School awareness programmes", "Catastrophe bonds", "Levees and seawalls", "Community evacuation drills"]}, {"id": "Q11", "q": "Raised platforms and stilt housing are examples of:", "o": ["Non-structural education measures", "Non-structural financial measures", "Non-engineered structural measures", "Engineered structural measures"]}, {"id": "Q12", "q": "What went wrong with the river embankments in the Gash River (Sudan) case study?", "o": ["The embankments were never built to the planned length", "Early warning sirens failed during the flood", "Zoning laws banned all repair work", "Sediment raised the riverbed, so the flood-control structures lost effectiveness"]}, {"id": "Q13", "q": "Insurance, catastrophe bonds and contingency funds are examples of:", "o": ["Engineered structural measures", "Remote sensing applications", "Non-structural financial measures", "Non-engineered structural measures"]}, {"id": "Q14", "q": "Which statement correctly completes: “Remote sensing sees it, GPS locates it, GIS ___”?", "o": ["analyses it", "builds it", "forecasts it", "insures it"]}, {"id": "Q15", "q": "Which technology works out a receiver's location from signals sent by several satellites at once?", "o": ["Doppler radar", "Seismograph", "GIS", "GPS"]}, {"id": "Q16", "q": "Comparing pre-disaster and post-disaster satellite images is mainly used for:", "o": ["Sounding sirens", "Registering voters in the affected area", "Drafting building codes", "Rapid damage assessment of buildings, roads and bridges"]}, {"id": "Q17", "q": "For risk assessment, GIS combines data on:", "o": ["Only satellite pictures of clouds", "Only the cost of land", "Population density, infrastructure, topography and historical events", "Only current weather forecasts"]}, {"id": "Q18", "q": "Shared maps that give every agency one operational picture mainly support:", "o": ["Raising of insurance premiums", "Soil formation", "Communication and coordination", "Retrofitting of buildings"]}, {"id": "Q19", "q": "How does GPS help GIS during field work after a disaster?", "o": ["It replaces the need for any map", "It produces high-resolution satellite photographs", "It tags damage, shelters and hazards with exact coordinates so they can be mapped", "It predicts the path of cyclones"]}, {"id": "Q20", "q": "How does remote sensing contribute to hazard prediction?", "o": ["It sets insurance premiums for flood zones", "It removes the need for warnings", "It lays out building codes for new construction", "Weather patterns and imagery help track the evolution of storms, hurricanes and floods"]}, {"id": "Q21", "q": "Which is the correct sequence of the four elements of an early warning system?", "o": ["Communication networks → Response protocols → Monitoring technology → Risk assessment", "Monitoring technology → Risk assessment → Communication networks → Response protocols", "Response protocols → Monitoring technology → Risk assessment → Communication networks", "Risk assessment → Response protocols → Monitoring technology → Communication networks"]}, {"id": "Q22", "q": "“Last-mile reach” in early warning means that:", "o": ["Warnings are issued once a year", "Only sirens may be used for alerts", "Alerts are sent only to government officials", "Alerts must reach vulnerable populations, not just the control room"]}, {"id": "Q23", "q": "What keeps both the technology and the communities ready for an early warning system?", "o": ["Publishing warnings only in technical journals", "Removing all sirens", "Regular drills and system tests", "Waiting for the next disaster"]}, {"id": "Q24", "q": "Which of the following is NOT a common channel for early warnings?", "o": ["Sirens", "SMS alerts", "Radio and TV", "Sealed annual budget files"]}, {"id": "Q25", "q": "The Disaster Management Act of 2005 was enacted after which event exposed gaps in India's system?", "o": ["The 2004 Indian Ocean tsunami", "The 2001 Gujarat earthquake", "The 1999 Odisha super cyclone", "The 1968 Himalayan earthquake"]}, {"id": "Q26", "q": "The apex body for disaster management in India, which lays down national policy, plans and guidelines, is chaired by:", "o": ["The Chief Minister of the affected state", "The Chief Justice of India", "The Home Secretary", "The Prime Minister"]}, {"id": "Q27", "q": "Which institution runs the Indian Tsunami Early Warning Centre?", "o": ["GSI", "NCS", "NIDM", "INCOIS"]}, {"id": "Q28", "q": "Which organisation issues river flood forecasts and warnings across basins?", "o": ["Geological Survey of India (GSI)", "Central Water Commission (CWC)", "National Institute of Disaster Management (NIDM)", "National Centre for Seismology (NCS)"]}, {"id": "Q29", "q": "Which organisation maps landslide susceptibility and studies geological hazards?", "o": ["India Meteorological Department (IMD)", "National Remote Sensing Centre (NRSC)", "Central Water Commission (CWC)", "Geological Survey of India (GSI)"]}, {"id": "Q30", "q": "Which specialist force, constituted in 2006, responds to natural and man-made disasters?", "o": ["National Disaster Response Force (NDRF)", "National Institute of Disaster Management (NIDM)", "Indian National Centre for Ocean Information Services (INCOIS)", "National Centre for Seismology (NCS)"]}, {"id": "Q31", "q": "Which body monitors earthquakes through the national seismic network?", "o": ["Central Water Commission (CWC)", "Geological Survey of India (GSI)", "National Centre for Seismology (NCS)", "National Remote Sensing Centre (NRSC)"]}, {"id": "Q32", "q": "Which statutory institute handles training, research and documentation in disaster management?", "o": ["National Disaster Response Force (NDRF)", "National Institute of Disaster Management (NIDM)", "Central Water Commission (CWC)", "India Meteorological Department (IMD)"]}, {"id": "Q33", "q": "Which of the following is an economic factor affecting land use?", "o": ["Cost of land", "Topography of the land", "Customs and traditions", "Soil quality"]}, {"id": "Q34", "q": "Constituting a multidisciplinary planning team is a key activity in which stage of risk-informed land use planning?", "o": ["Preparation", "Data information analysis", "Plan adoption", "Plan formulation"]}, {"id": "Q35", "q": "Which statement best describes non-structural measures as defined by UNDRR?", "o": ["Measures not involving physical construction that use knowledge, practice or agreement to reduce disaster risks, such as policies, laws, awareness and training", "Physical construction used to avoid the impacts of hazards", "The building of dams, levees and seawalls", "The application of engineering techniques to make structures hazard-resistant"]}, {"id": "Q36", "q": "During a disaster, GIS helps emergency teams by fusing which kinds of data into live situation maps?", "o": ["Satellite, weather, social-media and sensor data", "Only historical census records", "Only printed topographic sheets", "Only insurance claim records"]}, {"id": "Q37", "q": "Preventing disasters through mitigation is described as:", "o": ["Equally costly as responding", "More costly but faster than responding", "More effective and less costly than responding to them", "Less effective but cheaper than responding"]}, {"id": "Q38", "q": "Retrofitting of buildings means:", "o": ["Strengthening older buildings so that they meet current standards", "Demolishing all buildings in hazard zones", "Painting buildings with fire-resistant paint only", "Moving buildings to the floodplain"]}, {"id": "Q39", "q": "Which organisation forecasts and warns on cyclones, heavy rain, heatwaves and floods in India?", "o": ["Geological Survey of India (GSI)", "National Centre for Seismology (NCS)", "India Meteorological Department (IMD)", "National Institute of Disaster Management (NIDM)"]}, {"id": "Q40", "q": "Which organisation, part of ISRO, uses satellites to monitor floods, drought, fires and landslides?", "o": ["National Disaster Response Force (NDRF)", "Central Water Commission (CWC)", "Indian National Centre for Ocean Information Services (INCOIS)", "National Remote Sensing Centre (NRSC)"]}];
const $ = document.getElementById('app');
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let st = { view: 'start', name: '', reg: '', qs: [], i: 0, ans: {}, err: '', busy: false };
let started = 0;

function begin() {
  const name = document.getElementById('nm').value.trim().replace(/\s+/g, ' ');
  const reg = document.getElementById('rg').value.trim().toUpperCase().replace(/\s+/g, '');
  if (name.length < 2) { st.err = 'Please enter your full name.'; return render(); }
  if (!/^[A-Z0-9\-\/]{4,20}$/.test(reg)) { st.err = 'Please enter a valid register number (letters and digits only).'; return render(); }
  const n = Math.min(QUESTIONS_PER_STUDENT, BANK.length);
  // random question order, and random option order for every student
  st.qs = shuffle(BANK).slice(0, n).map(q => ({ id: q.id, q: q.q, opts: shuffle(q.o.map((t, k) => ({ t, k }))) }));
  Object.assign(st, { name, reg, i: 0, ans: {}, err: '', view: 'quiz' });
  started = Date.now(); render();
}
function choose(k) { st.ans[st.qs[st.i].id] = k; render(); }
function go(d) { st.i = Math.max(0, Math.min(st.qs.length - 1, st.i + d)); render(); }
function jump(i) { st.i = i; render(); }
async function submit() {
  const left = st.qs.length - Object.keys(st.ans).length;
  if (left > 0 && !confirm(left + ' question(s) are unanswered. Submit anyway?')) return;
  if (left === 0 && !confirm('Submit your answers? You cannot retake the quiz.')) return;
  st.busy = true; st.err = ''; render();
  try {
    const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'submit', name: st.name, reg: st.reg, answers: st.ans, total: st.qs.length }) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'Submission failed');
    st.view = 'done';
  } catch (e) { st.err = 'Could not submit: ' + e.message + '. Check your internet connection and press Submit again.'; }
  st.busy = false; render();
}
function render() {
  const notSet = API_URL.indexOf('PASTE_') === 0;
  if (st.view === 'start') {
    $.innerHTML = `<h1>${QUIZ_TITLE}</h1><p class="mut">Geo-informatics, early warning, land use planning, mitigation and India's disaster management institutions.</p>
    <div class="card"><label for="nm">Full name</label><input id="nm" type="text" autocomplete="off" value="${esc(st.name)}">
    <label for="rg">Register number</label><input id="rg" type="text" autocomplete="off" value="${esc(st.reg)}">
    ${st.err ? `<div class="err">${esc(st.err)}</div>` : ''}
    ${notSet ? '<div class="warn">Setup not finished: the Apps Script URL has not been added in index.html (see SETUP.md).</div>' : ''}
    <ul class="mut"><li>${Math.min(QUESTIONS_PER_STUDENT, BANK.length)} multiple-choice questions, shown in random order.</li><li>You can move back and forth before submitting.</li><li>You can attempt the quiz only once. Your marks will be shared by your staff.</li></ul>
    <button class="go" onclick="begin()" ${notSet ? 'disabled' : ''}>Start quiz</button></div>`;
  } else if (st.view === 'quiz') {
    const q = st.qs[st.i], n = st.qs.length, done = Object.keys(st.ans).length;
    $.innerHTML = `<div class="top"><span>${esc(st.name)} · ${esc(st.reg)}</span><span>${done}/${n} answered</span></div>
    <div class="bar"><i style="width:${(st.i + 1) / n * 100}%"></i></div>
    <div class="card"><div class="mut" style="font-size:.85rem">Question ${st.i + 1} of ${n}</div><p style="font-size:1.1rem;font-weight:600">${esc(q.q)}</p>
    ${q.opts.map((o, x) => `<button class="opt ${st.ans[q.id] === o.k ? 'sel' : ''}" onclick="choose(${o.k})"><b>${'ABCD'[x]}.</b> ${esc(o.t)}</button>`).join('')}
    ${st.err ? `<div class="err">${esc(st.err)}</div>` : ''}
    <div class="nav"><button class="sec" onclick="go(-1)" ${st.i === 0 ? 'disabled' : ''}>← Previous</button>
    ${st.i < n - 1 ? '<button class="go" onclick="go(1)">Next →</button>' : `<button class="go" onclick="submit()" ${st.busy ? 'disabled' : ''}>${st.busy ? 'Submitting…' : 'Submit quiz'}</button>`}</div>
    <div class="dots">${st.qs.map((x, j) => `<button class="${st.ans[x.id] !== undefined ? 'a' : ''} ${j === st.i ? 'c' : ''}" onclick="jump(${j})" aria-label="Question ${j + 1}">${j + 1}</button>`).join('')}</div>
    ${st.i < n - 1 ? `<div style="margin-top:14px"><button class="sec" onclick="submit()" ${st.busy ? 'disabled' : ''}>Submit now</button></div>` : ''}</div>`;
  } else {
    $.innerHTML = `<div class="card done"><div class="big">✅</div><h1>Response submitted</h1><p>Thank you, <b>${esc(st.name)}</b> (${esc(st.reg)}).<br>Your answers have been recorded. Your marks will be shared by your staff.</p></div>`;
  }
}
render();
</script></body></html>
