<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class Quizzes</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f5f7fa;--card:#fff;--ink:#1c2733;--mut:#5d6b7a;--ac:#0f5ea8;--acs:#e6f0fa;--ok:#2e7d4f;--no:#b3261e;--ln:#d9e0e8}
@media (prefers-color-scheme:dark){:root{--bg:#0f1720;--card:#18222e;--ink:#e8eef5;--mut:#9aa9b8;--ac:#5aa9f0;--acs:#1d3248;--ok:#5fc08a;--no:#ff8a80;--ln:#2b3a4a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.5rem;margin:.2em 0}.mut{color:var(--mut)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:20px;margin:14px 0}
label{display:block;font-weight:600;margin:14px 0 6px}
input,select{padding:11px 12px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--ink);font:inherit}
input.w{width:100%}input:focus,select:focus{outline:2px solid var(--ac);border-color:transparent}
button{font:inherit;cursor:pointer}
.go{padding:12px 22px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-weight:700}.go:disabled{opacity:.5;cursor:not-allowed}
.sec{padding:11px 18px;border-radius:10px;border:1px solid var(--ln);background:var(--card);color:var(--ink)}.sec:disabled{opacity:.5}
.tile{display:block;width:100%;text-align:left;margin:12px 0;padding:18px;border-radius:14px;border:1px solid var(--ln);background:var(--card);color:var(--ink)}
.tile:hover{border-color:var(--ac)}.tile b{display:block;font-size:1.1rem}.tile span{color:var(--mut);font-size:.92rem}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--ink)}
.opt:hover{border-color:var(--ac)}.opt.sel{border-color:var(--ac);background:var(--acs);font-weight:600}
.bar{height:6px;border-radius:3px;background:var(--ln);margin:8px 0 2px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);transition:width .25s}
.top{display:flex;justify-content:space-between;font-size:.9rem;color:var(--mut);gap:10px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.dots button{width:32px;height:32px;border-radius:8px;border:1px solid var(--ln);background:var(--card);color:var(--ink);font-size:.8rem}
.dots button.a{background:var(--acs);border-color:var(--ac)}.dots button.c{outline:2px solid var(--ac)}
.err{color:var(--no);margin:10px 0;font-weight:600}
.done{text-align:center;padding:30px 10px}.done .big{font-size:3rem}
.back{background:none;border:0;color:var(--ac);padding:4px 0;font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:520px}th,td{padding:9px 10px;border-bottom:1px solid var(--ln);text-align:left}th{font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}td.n,th.n{text-align:right}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin:6px 0 12px}.stats b{font-size:1.3rem;display:block}
body.secure{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body.secure img{pointer-events:none}
#wm{display:none;position:fixed;inset:0;z-index:50;pointer-events:none;background-repeat:repeat}
body.secure #wm{display:block}
#toast{display:none;position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:120;background:var(--no);color:#fff;padding:10px 16px;border-radius:10px;font-weight:700;max-width:90%;text-align:center}
#shield{display:none;position:fixed;inset:0;z-index:99;background:var(--bg);align-items:center;justify-content:center;text-align:center;padding:24px;font-weight:600}
body.hide #app{visibility:hidden}body.hide #shield{display:flex}
@media print{body *{display:none!important}body::before{content:"Printing and saving are disabled for this quiz.";display:block;font:20px system-ui;padding:40px}}
</style></head><body><main id="app"></main><div id="wm" aria-hidden="true"></div><div id="toast" role="alert"></div><div id="shield">The quiz is hidden because the window lost focus or a capture was attempted.<br>Return to this window to continue. The timer keeps running.</div>
<script>
/* ================= SETTINGS ================= */
const API_URL = "https://script.google.com/macros/s/AKfycbww9CZzyGgc8ZeEYbxEGYKYgvGkQn7hCXPlU_Kgg9u1U_b3w8eenn6CKngnPH0vUINqxA/exec";
const QUIZZES = {
  DM: { secs: 45, name: 'Disaster Management Quiz', label: 'Disaster Management', hash: 'dm',
        sub: "Geo-informatics, early warning, land use planning, mitigation and India's disaster management institutions.",
        bank: [{"id": "Q01", "q": "Risk-sensitive land use planning is best described as:", "o": ["A non-structural strategy that uses hazard information to steer development away from the most dangerous zones", "A structural strategy that relies on building dams and embankments", "A satellite service that monitors hazards in real time", "A relief programme that distributes aid after a disaster"]}, {"id": "Q02", "q": "How many stages are there in the ISO/ADPC process of integrating disaster risk reduction into land use planning?", "o": ["Seven", "Four", "Five", "Three"]}, {"id": "Q03", "q": "Which stage of risk-informed land use planning includes vulnerability indexing and SWOT analysis?", "o": ["Plan adoption", "Plan formulation", "Data analysis", "Preparation"]}, {"id": "Q04", "q": "Public hearing and submission of the report to the authorities belong to which stage?", "o": ["Plan formulation", "Data gathering", "Plan adoption", "Preparation"]}, {"id": "Q05", "q": "Which set lists the three things to consider in land use planning strategies for disaster risk reduction?", "o": ["Building dams, digging canals, and planting trees", "Maintaining natural systems, avoiding exposure to risk, and design and setting controls", "Issuing alerts, running drills, and training volunteers", "Raising funds, hiring staff, and printing maps"]}, {"id": "Q06", "q": "In land use planning, Gaps Analysis is used to:", "o": ["Count the number of buildings in a flood zone", "Estimate the cost of land near markets", "Compare the current situation with a set of desired resilience qualities", "Plot the tracks of past events on a map"]}, {"id": "Q07", "q": "Which of the following is a barrier to disaster-resilient land use planning?", "o": ["Development pressure", "Accurate knowledge of the extent of every hazard", "Complete public understanding of hazards", "Strong integration across sectors"]}, {"id": "Q08", "q": "According to UNDRR, structural measures are:", "o": ["Policies, laws and public awareness raising", "Insurance and financial contingency funds", "Agreements and training programmes only", "Any physical construction, or engineering technique, used to reduce or avoid the possible impacts of hazards"]}, {"id": "Q09", "q": "Which of these is a non-structural mitigation measure?", "o": ["Raising an embankment along a river", "Constructing a seawall", "Zoning that restricts building in high-risk areas", "Building a dam"]}, {"id": "Q10", "q": "Which of these is an engineered structural mitigation measure?", "o": ["School awareness programmes", "Catastrophe bonds", "Levees and seawalls", "Community evacuation drills"]}, {"id": "Q11", "q": "Raised platforms and stilt housing are examples of:", "o": ["Non-structural education measures", "Non-structural financial measures", "Non-engineered structural measures", "Engineered structural measures"]}, {"id": "Q12", "q": "What went wrong with the river embankments in the Gash River (Sudan) case study?", "o": ["The embankments were never built to the planned length", "Early warning sirens failed during the flood", "Zoning laws banned all repair work", "Sediment raised the riverbed, so the flood-control structures lost effectiveness"]}, {"id": "Q13", "q": "Insurance, catastrophe bonds and contingency funds are examples of:", "o": ["Engineered structural measures", "Remote sensing applications", "Non-structural financial measures", "Non-engineered structural measures"]}, {"id": "Q14", "q": "Which statement correctly completes: “Remote sensing sees it, GPS locates it, GIS ___”?", "o": ["analyses it", "builds it", "forecasts it", "insures it"]}, {"id": "Q15", "q": "Which technology works out a receiver's location from signals sent by several satellites at once?", "o": ["Doppler radar", "Seismograph", "GIS", "GPS"]}, {"id": "Q16", "q": "Comparing pre-disaster and post-disaster satellite images is mainly used for:", "o": ["Sounding sirens", "Registering voters in the affected area", "Drafting building codes", "Rapid damage assessment of buildings, roads and bridges"]}, {"id": "Q17", "q": "For risk assessment, GIS combines data on:", "o": ["Only satellite pictures of clouds", "Only the cost of land", "Population density, infrastructure, topography and historical events", "Only current weather forecasts"]}, {"id": "Q18", "q": "Shared maps that give every agency one operational picture mainly support:", "o": ["Raising of insurance premiums", "Soil formation", "Communication and coordination", "Retrofitting of buildings"]}, {"id": "Q19", "q": "How does GPS help GIS during field work after a disaster?", "o": ["It replaces the need for any map", "It produces high-resolution satellite photographs", "It tags damage, shelters and hazards with exact coordinates so they can be mapped", "It predicts the path of cyclones"]}, {"id": "Q20", "q": "How does remote sensing contribute to hazard prediction?", "o": ["It sets insurance premiums for flood zones", "It removes the need for warnings", "It lays out building codes for new construction", "Weather patterns and imagery help track the evolution of storms, hurricanes and floods"]}, {"id": "Q21", "q": "Which is the correct sequence of the four elements of an early warning system?", "o": ["Communication networks → Response protocols → Monitoring technology → Risk assessment", "Monitoring technology → Risk assessment → Communication networks → Response protocols", "Response protocols → Monitoring technology → Risk assessment → Communication networks", "Risk assessment → Response protocols → Monitoring technology → Communication networks"]}, {"id": "Q22", "q": "“Last-mile reach” in early warning means that:", "o": ["Warnings are issued once a year", "Only sirens may be used for alerts", "Alerts are sent only to government officials", "Alerts must reach vulnerable populations, not just the control room"]}, {"id": "Q23", "q": "What keeps both the technology and the communities ready for an early warning system?", "o": ["Publishing warnings only in technical journals", "Removing all sirens", "Regular drills and system tests", "Waiting for the next disaster"]}, {"id": "Q24", "q": "Which of the following is NOT a common channel for early warnings?", "o": ["Sirens", "SMS alerts", "Radio and TV", "Sealed annual budget files"]}, {"id": "Q25", "q": "The Disaster Management Act of 2005 was enacted after which event exposed gaps in India's system?", "o": ["The 2004 Indian Ocean tsunami", "The 2001 Gujarat earthquake", "The 1999 Odisha super cyclone", "The 1968 Himalayan earthquake"]}, {"id": "Q26", "q": "The apex body for disaster management in India, which lays down national policy, plans and guidelines, is chaired by:", "o": ["The Chief Minister of the affected state", "The Chief Justice of India", "The Home Secretary", "The Prime Minister"]}, {"id": "Q27", "q": "Which institution runs the Indian Tsunami Early Warning Centre?", "o": ["GSI", "NCS", "NIDM", "INCOIS"]}, {"id": "Q28", "q": "Which organisation issues river flood forecasts and warnings across basins?", "o": ["Geological Survey of India (GSI)", "Central Water Commission (CWC)", "National Institute of Disaster Management (NIDM)", "National Centre for Seismology (NCS)"]}, {"id": "Q29", "q": "Which organisation maps landslide susceptibility and studies geological hazards?", "o": ["India Meteorological Department (IMD)", "National Remote Sensing Centre (NRSC)", "Central Water Commission (CWC)", "Geological Survey of India (GSI)"]}, {"id": "Q30", "q": "Which specialist force, constituted in 2006, responds to natural and man-made disasters?", "o": ["National Disaster Response Force (NDRF)", "National Institute of Disaster Management (NIDM)", "Indian National Centre for Ocean Information Services (INCOIS)", "National Centre for Seismology (NCS)"]}, {"id": "Q31", "q": "Which body monitors earthquakes through the national seismic network?", "o": ["Central Water Commission (CWC)", "Geological Survey of India (GSI)", "National Centre for Seismology (NCS)", "National Remote Sensing Centre (NRSC)"]}, {"id": "Q32", "q": "Which statutory institute handles training, research and documentation in disaster management?", "o": ["National Disaster Response Force (NDRF)", "National Institute of Disaster Management (NIDM)", "Central Water Commission (CWC)", "India Meteorological Department (IMD)"]}, {"id": "Q33", "q": "Which of the following is an economic factor affecting land use?", "o": ["Cost of land", "Topography of the land", "Customs and traditions", "Soil quality"]}, {"id": "Q34", "q": "Constituting a multidisciplinary planning team is a key activity in which stage of risk-informed land use planning?", "o": ["Preparation", "Data information analysis", "Plan adoption", "Plan formulation"]}, {"id": "Q35", "q": "Which statement best describes non-structural measures as defined by UNDRR?", "o": ["Measures not involving physical construction that use knowledge, practice or agreement to reduce disaster risks, such as policies, laws, awareness and training", "Physical construction used to avoid the impacts of hazards", "The building of dams, levees and seawalls", "The application of engineering techniques to make structures hazard-resistant"]}, {"id": "Q36", "q": "During a disaster, GIS helps emergency teams by fusing which kinds of data into live situation maps?", "o": ["Satellite, weather, social-media and sensor data", "Only historical census records", "Only printed topographic sheets", "Only insurance claim records"]}, {"id": "Q37", "q": "Preventing disasters through mitigation is described as:", "o": ["Equally costly as responding", "More costly but faster than responding", "More effective and less costly than responding to them", "Less effective but cheaper than responding"]}, {"id": "Q38", "q": "Retrofitting of buildings means:", "o": ["Strengthening older buildings so that they meet current standards", "Demolishing all buildings in hazard zones", "Painting buildings with fire-resistant paint only", "Moving buildings to the floodplain"]}, {"id": "Q39", "q": "Which organisation forecasts and warns on cyclones, heavy rain, heatwaves and floods in India?", "o": ["Geological Survey of India (GSI)", "National Centre for Seismology (NCS)", "India Meteorological Department (IMD)", "National Institute of Disaster Management (NIDM)"]}, {"id": "Q40", "q": "Which organisation, part of ISRO, uses satellites to monitor floods, drought, fires and landslides?", "o": ["National Disaster Response Force (NDRF)", "Central Water Commission (CWC)", "Indian National Centre for Ocean Information Services (INCOIS)", "National Remote Sensing Centre (NRSC)"]}] },
  UHV: { secs: 40, name: 'UHV II Quiz', label: 'UHV II - Nature & Existence', hash: 'uhv',
        sub: 'Understanding harmony in nature and existence: the four orders, mutual fulfilment, self-regulation, co-existence and holistic perception.',
        bank: [{"id": "U01", "q": "A pond contains water, algae, fish and a fisherman. Which option classifies these units into the correct orders (in the same sequence)?", "o": ["Physical, Bio, Human, Animal", "Physical, Bio, Animal, Human", "Physical, Animal, Bio, Human", "Bio, Physical, Animal, Human"]}, {"id": "U02", "q": "Analysing the four orders, which statement correctly differentiates them by what they are made of?", "o": ["Only the physical order is material; the other three consist of consciousness alone", "Physical, bio and animal orders are purely material, while only the human order has consciousness", "Physical and bio orders are purely material, while animal and human orders are each a co-existence of the Self (consciousness) and a material body", "All four orders are co-existence of the Self and a body"]}, {"id": "U03", "q": "Examine the relationship among the four orders. What is the key difference between the human order and the other three?", "o": ["The first three orders exploit the human order, which is why humans have to dominate them", "All four orders are already fulfilling for each other without any exception", "The human order is not part of nature, so it has no relationship with the other three", "The first three orders already enrich the human being, but the human being currently dominates and exploits them instead of enriching them"]}, {"id": "U04", "q": "A person says, “I want to enrich nature,” yet cuts down a forest for personal convenience. Which analysis best explains this contradiction?", "o": ["Nature itself is meant to be exploited by the human order", "Natural acceptance changes from person to person, so he actually wants to exploit nature", "His natural acceptance is to enrich, but his conduct runs on assuming without knowing, i.e. without right understanding, so it contradicts his acceptance", "His statement is false because no human being has a natural acceptance to enrich nature"]}, {"id": "U05", "q": "Which of the following is an example of mutual fulfilment between the physical order and the bio order?", "o": ["Soil nourishes plants, and plants hold and enrich the soil", "A farmer harvesting a crop", "A lion hunting a deer", "Birds carrying seeds from one place to another"]}, {"id": "U06", "q": "A dead animal decays and makes the soil fertile; the fertile soil supports new plants; the plants feed other animals. What can be inferred from this chain?", "o": ["The chain proves that the physical order depends on nothing", "Animals are unnecessary for the soil and plants", "The orders are interconnected in a cycle where what one order gives back becomes the enrichment of another", "Only the animal order benefits from the chain"]}, {"id": "U07", "q": "Which inference is valid from the sequence Physical order ≫ Bio order ≫ Animal order ≫ Human order in terms of quantity?", "o": ["Since the animal order is smaller than the bio order, animals are not needed in nature", "Human beings are the most abundant, so they must regulate the other orders", "The quantity of each order is random and has no relationship with the others", "Nature is organised so that the requirement of every order is already available in abundance"]}, {"id": "U08", "q": "Which statement best explains why a forest stays in balance without any human regulation?", "o": ["The lions deliberately decide how many deer to eat", "Human beings continuously control the number of animals and plants", "The proportion of soil, plants and animals of various species is self-regulated within nature itself", "The forest stays in balance only because plants grow without any limit"]}, {"id": "U09", "q": "A manager removes all the predators from a forest to ‘protect’ the deer. Based on the idea of self-regulation in nature, what is the most likely concern?", "o": ["The soil will immediately turn into plants", "The deer will become members of the human order", "Nothing will change because forests need human regulation anyway", "The proportion among species that nature had self-regulated gets disturbed, so human regulation ends up breaking the harmony"]}, {"id": "U10", "q": "Compare self-regulation in a forest with the human being. Which comparison is correct as per the handout?", "o": ["A forest is already self-regulated, while the human being too can become self-organised and in harmony within, with right understanding", "Neither a forest nor a human being can be self-regulated", "A forest needs human regulation, while the human being is always self-regulated", "The human being is self-regulated only through external control by others"]}, {"id": "U11", "q": "Which scenario shows self-regulation in nature rather than external regulation?", "o": ["A government department limits the number of trees that can be cut", "A farmer decides how much water each plant gets", "In a forest, deer never eat up all the grass and lions never eat up all the deer, with no one managing it", "A zoo keeper decides the diet of caged animals"]}, {"id": "U12", "q": "If plants disappear completely from a region, which analysis is most complete according to the idea of interconnectedness?", "o": ["Nothing changes, as the physical order is independent of all other orders", "Animals lose their food, the soil loses its mutually fulfilling partner, and the other orders in the region are affected as well", "Only the bio order is affected, because the orders are not related to each other", "Only the human order is affected, as other orders do not depend on plants"]}, {"id": "U13", "q": "A scientist claims that building ever-better machines will give permanent development in the material world. Which analysis from the handout challenges this claim?", "o": ["Whatever is done with the material world is cyclic and keeps returning to its initial state, so lasting development is possible only in the Self", "Development is possible only if the number of machines is increased", "The material world develops in a straight line, but too slowly to observe", "Material units are continuous, so they never change"]}, {"id": "U14", "q": "Which of the following represents a cyclic process in nature?", "o": ["Animal dung and dead bodies enrich the soil, the soil nourishes plants, and plants feed animals", "A human being developing right understanding and right feeling in the Self", "Space being unlimited and all-pervading", "Units being energised in space"]}, {"id": "U15", "q": "A body decays after death, yet the Self is said to continue. Which statement correctly distinguishes the two kinds of units?", "o": ["Both are temporary in time", "Both are cyclic and return to an initial state", "Material units are continuous, while the Self is temporary", "Material units are temporary in time and cyclic, while consciousness units (the Self) are continuous"]}, {"id": "U16", "q": "Why is real, permanent development possible only in the human order and not in the material world?", "o": ["Because the human body is made of more matter than the other orders", "Because material units keep developing in a straight line", "Permanent change is possible only in the domain of consciousness, through right understanding and right feeling in the Self", "Because the human order is the only order that exists in space"]}, {"id": "U17", "q": "A community composts its kitchen waste and returns it to the soil to grow plants. Which idea from the handout does this best reflect?", "o": ["The idea that material units are continuous and never change", "The idea that the human order is separate from nature", "The idea that space itself carries out the activity", "The cyclic nature of material units and the mutual fulfilment among the orders, where the output of one becomes the enrichment of another"]}, {"id": "U18", "q": "Which pair of statements correctly distinguishes units from space?", "o": ["Space is active, whereas units are passive and boundaryless", "Units are limited in size and are activity; space is unlimited and is no-activity", "Both units and space are limited in size and active", "Units are unlimited and no-activity; space is limited and active"]}, {"id": "U19", "q": "A student says, “Space is the most active reality because it holds everything.” Identify the flaw in this statement.", "o": ["Units do not need space, so space is irrelevant to activity", "Space is a unit and therefore must be active", "Space is no-activity; all activity takes place only in the units", "Space has a definite size, so it cannot hold everything"]}, {"id": "U20", "q": "A student claims that inside a solid stone there is no space at all. Which concept from the handout shows the flaw?", "o": ["Units are unlimited, so they replace space", "Space is a unit of the physical order", "Space is limited in size, so it cannot enter units", "Submergence: units are inseparable from space, and wherever a unit is, space is also there"]}, {"id": "U21", "q": "Even the smallest atom and the largest planet are active. Which quality of units, arising from their co-existence with space, explains this?", "o": ["Every unit is energised in space", "Every unit is made of lumps and fluids", "Every unit is a consciousness unit", "Every unit is limited in activity by space"]}, {"id": "U22", "q": "Water always freezes and boils in a definite way, which is why we can recognise and study it. Which quality of units explains this?", "o": ["Being a consciousness unit, water decides its conduct each time", "Being no-activity, water simply stays unchanged", "Being unlimited in size, water has no definite conduct", "Being self-organised in space, the unit is in a definite order and shows a definite conduct"]}, {"id": "U23", "q": "Why is the conduct of a stone definite, while the conduct of a human being can be indefinite?", "o": ["A material unit fulfils its relationships in a definite way, while the human Self can act by assuming without knowing and so become indefinite", "Human beings are not in space, so their conduct is uncertain", "Stones have consciousness and human beings do not", "Stones are energised but human beings are not"]}, {"id": "U24", "q": "Which statement best differentiates ‘existence’ from the idea of ‘co-existence’ as used in the handout?", "o": ["Existence refers only to units, and space does not exist", "Existence refers only to space, and units are separate from it", "Co-existence means that the human order exists alone, away from space", "Existence is whatever exists, and it is in the form of co-existence, i.e. units submerged in space"]}, {"id": "U25", "q": "A student says, “I can live and exist independently of everyone else.” Which analysis from the handout shows the flaw?", "o": ["Only material units are related to each other; human beings are not", "Relationships exist only in space, and human beings are not in space", "Every unit is in co-existence and recognises and fulfils its relationship with every other unit in space, so no unit exists in isolation", "Units are related to others only when they are in the same order"]}, {"id": "U26", "q": "Which sequence correctly shows how complex material units are composed from simpler ones?", "o": ["Atom → molecule → molecular structure (lump or fluid) → cells → plant, animal and human bodies", "Plant body → cells → molecule → atom → lump", "Cells → atom → molecule → plant, animal and human bodies", "Molecular structure → atom → cells → molecule → body"]}, {"id": "U27", "q": "Two managers handle a conflict. Manager A acts on assuming based on knowing, whereas Manager B acts on assuming without knowing. What is the likely difference?", "o": ["A's conduct will be indefinite, whereas B's will be definite", "Both will show equally definite conduct", "A's conduct will be definite, whereas B's conduct will be indefinite", "Neither will show any conduct, as the Self is no-activity"]}, {"id": "U28", "q": "Which sequence correctly describes the two parts of development in the Self?", "o": ["Dominating the other orders, then developing right feeling", "Producing more material goods, then storing them", "Living without any thought, then developing right understanding", "Developing right understanding and right feeling, then living accordingly in desires, thoughts, behaviour, work and participation"]}, {"id": "U29", "q": "A school trains students only in skills to produce more material goods. Which analysis from the handout shows why this is inadequate for development?", "o": ["Development comes automatically, without any education", "Material change is cyclic, whereas real development is in the Self through right understanding and right feeling, facilitated by education-sanskar", "Only animals need education-sanskar, not human beings", "Material goods are continuous, so they cannot help development"]}, {"id": "U30", "q": "Which match of the level and its expression of co-existence is correct?", "o": ["Existence – feeling of trust; Family – units in space", "Nature – mutual fulfilment; Existence – co-existence", "Family – mutual fulfilment; Nature – trust and respect", "Nature – co-existence; Existence – mutual fulfilment"]}, {"id": "U31", "q": "How are harmony in the individual, family, society and nature related to existence?", "o": ["They are the cause of existence, not its expression", "They are systematic expressions of existence as co-existence at different levels", "They are four unrelated types of harmony", "They exist independently of co-existence"]}, {"id": "U32", "q": "A student concludes that ‘value’ means personal gain from others. Which correction fits the handout?", "o": ["Value means making other orders follow the human being", "Value is a unit's participation in the larger order, and the human being's value is to realise co-existence and live in it", "Value is whatever a human being can extract from nature", "Value is limited to the human order and has nothing to do with nature"]}, {"id": "U33", "q": "A student notices every day that his desires conflict with his natural acceptance and then corrects them. Which two components of the programme of action is he practising?", "o": ["Self-exploration only, with no awareness", "Self-awareness and self-evaluation", "Dominating others and gathering facilities", "Self-promotion and self-defence"]}, {"id": "U34", "q": "Which of the following is an example of self-exploration rather than blind belief?", "o": ["Memorising the proposals for an examination", "Verifying the proposals on one's own natural acceptance and living accordingly", "Accepting a proposal because a teacher said it", "Rejecting a proposal without ever verifying it"]}, {"id": "U35", "q": "Why does the handout treat ‘universal human order’ and ‘universal order’ as synonymous?", "o": ["Because universal order is separate from co-existence", "Because the other three orders are replaced by the human order", "Because the human order is the only order that exists", "Because the unfolding of co-existence is completed through the human being, whose completion is the universal human order"]}, {"id": "U36", "q": "Why would a value-based programme of education-sanskar shorten the time needed to develop right understanding in society?", "o": ["Because it removes the need for self-exploration", "Because it replaces the Self with material facilities", "Because it reduces the number of people in society", "Because right understanding becomes a definite component of the system of society rather than depending on individuals alone"]}, {"id": "U37", "q": "Which analysis of global warming and climate change is consistent with the handout?", "o": ["It is the result of the human order dominating and exploiting the other three orders, not a failure of nature's own harmony", "It shows that physical order is unnecessary for the human being", "It shows that the animal order is dominating the human order", "It shows that nature is not self-regulated and needs more exploitation"]}, {"id": "U38", "q": "A speaker argues, “Humans are the most important, so the other orders exist only for us.” Which analysis shows why this is inconsistent with the handout?", "o": ["The human order is the largest in quantity, so it must be dominated", "Animals and plants have decided that humans are not important", "The other three orders are not related to the human order at all", "The human order is part of nature and depends on the other three, which exist in far greater quantity; the relationship is of mutual fulfilment, not domination"]}, {"id": "U39", "q": "Birds eat fruits and spread the seeds, and also protect plants from harmful insects. What does this show about the relationship between the animal and bio orders?", "o": ["It shows that the two orders are unrelated", "It is one-sided: only the bio order benefits", "It is one-sided: only the animal order benefits", "It is mutual: animals depend on plants for food and in turn enrich plants"]}, {"id": "U40", "q": "Which statement best integrates the holistic perception of harmony at all levels of existence?", "o": ["Each order exists in isolation, and harmony arises only inside the human being", "Space is active and units are passive, and harmony is created by human regulation", "Existence is only a collection of material units, and the human being needs to dominate them", "Existence is co-existence of units submerged in space; units are energised, self-organised and relational, and the human being's role is to realise and live in co-existence"]}] }
};
const LEAVE_PENALTY = 5;   // seconds deducted every time the student leaves the quiz window / switches apps
/* secs = time allowed for EACH question, in seconds (change per quiz above) */
/* ============================================ */
const $ = document.getElementById('app');
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const post = async body => { const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) }); return r.json(); };
let st = { view: 'home', qz: null, name: '', reg: '', qs: [], i: 0, ans: {}, err: '', busy: false };
let sf = { pw: '', ok: false, rows: [], qz: 'DM', q: '', err: '', warn: '', busy: false };

function open_(v) {
  if (st.view === 'quiz') return;
  if (v === 'staff') { st.view = 'staff'; }
  else if (QUIZZES[v]) { st = { view: 'start', qz: v, name: '', reg: '', qs: [], i: 0, ans: {}, err: '', busy: false }; }
  else st.view = 'home';
  const h = v === 'staff' ? 'staff' : QUIZZES[v] ? QUIZZES[v].hash : '';
  try { history.replaceState(null, '', '#' + h); } catch (e) {}
  render();
}
function fromHash() {
  const h = (location.hash || '').replace('#', '').toLowerCase();
  if (h === 'staff') return 'staff';
  return Object.keys(QUIZZES).find(k => QUIZZES[k].hash === h) || 'home';
}
function begin() {
  const name = document.getElementById('nm').value.trim().replace(/\s+/g, ' ');
  const reg = document.getElementById('rg').value.trim().toUpperCase().replace(/\s+/g, '');
  st.name = name; st.reg = reg;
  if (name.length < 2) { st.err = 'Please enter your full name.'; return render(); }
  if (!/^[A-Z0-9\-\/]{4,20}$/.test(reg)) { st.err = 'Please enter a valid register number (letters and digits only).'; return render(); }
  const bank = QUIZZES[st.qz].bank;
  st.qs = shuffle(bank).map(q => ({ id: q.id, q: q.q, opts: shuffle(q.o.map((t, k) => ({ t, k }))) }));
  Object.assign(st, { i: 0, ans: {}, err: '', view: 'quiz', leaves: 0 }); away = false; startT(); render();
}
let tmr = 0;
function stopT() { clearInterval(tmr); tmr = 0; }
function startT() {
  stopT(); st.deadline = Date.now() + QUIZZES[st.qz].secs * 1000;
  tmr = setInterval(tickT, 250);
}
function leftT() { return Math.max(0, Math.ceil((st.deadline - Date.now()) / 1000)); }
function tickT() {
  if (st.view !== 'quiz') return stopT();
  const l = leftT(), T = QUIZZES[st.qz].secs;
  const t = document.getElementById('tm'), b = document.getElementById('tb');
  if (t) { t.textContent = l + 's'; t.style.color = l <= 10 ? 'var(--no)' : ''; }
  if (b) { b.style.width = (l / T * 100) + '%'; b.style.background = l <= 10 ? 'var(--no)' : ''; }
  if (l <= 0) { stopT(); if (st.i < st.qs.length - 1) go(1); else submit(true); }
}
function choose(k) { st.ans[st.qs[st.i].id] = k; render(); }
function go(d) { st.i = Math.max(0, Math.min(st.qs.length - 1, st.i + d)); startT(); render(); }
async function submit(auto) {
  if (st.busy) return;
  const left = st.qs.length - Object.keys(st.ans).length;
  muteAway = true;
  const okSubmit = auto || confirm(left > 0 ? left + ' question(s) are unanswered. Submit anyway?' : 'Submit your answers? You cannot retake the quiz.');
  setTimeout(() => { muteAway = false; }, 500);
  if (!okSubmit) return;
  stopT(); st.busy = true; st.err = ''; render();
  try {
    const j = await post({ action: 'submit', name: st.name, reg: st.reg, answers: st.ans, total: st.qs.length, quiz: st.qz });
    if (!j.ok) throw new Error(j.error || 'Submission failed');
    st.view = 'done';
  } catch (e) { st.err = 'Could not submit: ' + e.message + '. Check your internet connection and press Submit again.'; }
  st.busy = false; render();
}
window.addEventListener('beforeunload', e => { if (st.view === 'quiz') { e.preventDefault(); e.returnValue = ''; } });

/* ---- staff ---- */
async function staffLoad() {
  const e = document.getElementById('pw'); if (e) sf.pw = e.value;
  sf.busy = true; sf.err = ''; sf.warn = ''; render();
  try {
    const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'results', password: sf.pw }) });
    const txt = await r.text(); let j;
    try { j = JSON.parse(txt); } catch (x) { throw new Error('The Apps Script did not return results (it may need to be deployed with access set to "Anyone", or re-authorised). Response started with: ' + txt.slice(0, 80).replace(/\s+/g, ' ')); }
    if (!j.ok) throw new Error(j.error || 'Failed');
    sf.rows = (j.rows || []).map(x => Object.assign({}, x, { quiz: x.quiz || QUIZZES.DM.label }));
    if (!j.v || j.v < 3) sf.warn = 'Your Apps Script is still running an OLD version of Code.gs. Paste the latest Code.gs and use Deploy → Manage deployments → Edit → New version. Until then, UHV II submissions are not recorded correctly.';
    sf.ok = true;
  } catch (e) { sf.err = (e.message === 'Failed to fetch' ? 'Could not reach the Apps Script (Failed to fetch). Check the internet connection, and that the deployment is a Web app with "Who has access: Anyone".' : e.message); sf.ok = false; }
  sf.busy = false; render();
}
const sfRows = () => { const s = sf.q.trim().toLowerCase(), L = QUIZZES[sf.qz].label;
  return sf.rows.filter(r => r.quiz === L && (!s || String(r.name).toLowerCase().includes(s) || String(r.reg).toLowerCase().includes(s))); };
function sfQuiz(v) { sf.qz = v; render(); }
function sfSearch(v) { sf.q = v; render(); const e = document.getElementById('sq'); if (e) { e.focus(); e.setSelectionRange(v.length, v.length); } }
function sfXlsx() {
  const f = sfRows(), data = [['S.No', 'Student Name', 'Register Number', 'Marks Scored', 'Total Marks', 'Percentage', 'Submitted At']];
  f.forEach((r, i) => data.push([i + 1, r.name, r.reg, r.score, r.total, r.total ? Math.round(r.score / r.total * 1000) / 10 : 0, r.time]));
  const ws = XLSX.utils.aoa_to_sheet(data); ws['!cols'] = [{ wch: 6 }, { wch: 30 }, { wch: 18 }, { wch: 13 }, { wch: 12 }, { wch: 12 }, { wch: 22 }];
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Results');
  XLSX.writeFile(wb, QUIZZES[sf.qz].name.replace(/\s+/g, '_') + '_Results_' + new Date().toISOString().slice(0, 10) + '.xlsx');
}

function render() {
  secure();
  const notSet = API_URL.indexOf('PASTE_') === 0;
  if (st.view === 'home') {
    $.innerHTML = `<h1>Class Quizzes</h1><p class="mut">Choose your quiz.</p>
    <button class="tile" onclick="open_('DM')"><b>📘 Disaster Management Quiz</b><span>${QUIZZES.DM.bank.length} questions · random order</span></button>
    <button class="tile" onclick="open_('UHV')"><b>🌿 UHV II Quiz</b><span>Harmony in nature and existence · ${QUIZZES.UHV.bank.length} questions · random order</span></button>
    <button class="tile" onclick="open_('staff')"><b>🔒 Staff login</b><span>View marks and download Excel (password required)</span></button>`;
  } else if (st.view === 'start') {
    const Q = QUIZZES[st.qz];
    $.innerHTML = `<button class="back" onclick="open_('home')">← All quizzes</button><h1>${Q.name}</h1><p class="mut">${Q.sub}</p>
    <div class="card"><label for="nm">Full name</label><input class="w" id="nm" type="text" autocomplete="off" value="${esc(st.name)}">
    <label for="rg">Register number</label><input class="w" id="rg" type="text" autocomplete="off" value="${esc(st.reg)}">
    ${st.err ? `<div class="err">${esc(st.err)}</div>` : ''}
    <ul class="mut"><li>${Q.bank.length} multiple-choice questions, shown in random order.</li><li>Each question has a time limit of ${Q.secs} seconds. When time is up, the quiz moves to the next question automatically, and you cannot go back.</li><li>Screenshots, copying, printing and switching windows are blocked during the quiz. Your name and register number appear on every question screen, so any captured image can be traced to you.</li><li>Every time you minimise the page or switch to another app, ${LEAVE_PENALTY} seconds are deducted from the time of that question.</li><li>You can attempt this quiz only once. Your marks will be shared by your staff.</li></ul>
    <button class="go" onclick="begin()">Start quiz</button></div>`;
  } else if (st.view === 'quiz') {
    const q = st.qs[st.i], n = st.qs.length, done = Object.keys(st.ans).length, T = QUIZZES[st.qz].secs, l = st.busy || !st.deadline ? 0 : leftT();
    $.innerHTML = `<div class="top"><span>${esc(st.name)} · ${esc(st.reg)}</span><span>${done}/${n} answered</span></div>
    <div class="bar"><i style="width:${(st.i + 1) / n * 100}%"></i></div>
    <div class="card"><div class="top" style="font-size:.85rem"><span>${QUIZZES[st.qz].name} · Question ${st.i + 1} of ${n}</span><b>⏱ <span id="tm" style="${l <= 10 ? 'color:var(--no)' : ''}">${l}s</span></b></div>
    <div class="bar"><i id="tb" style="width:${l / T * 100}%;${l <= 10 ? 'background:var(--no)' : ''}"></i></div>
    <p style="font-size:1.1rem;font-weight:600">${esc(q.q)}</p>
    ${q.opts.map((o, x) => `<button class="opt ${st.ans[q.id] === o.k ? 'sel' : ''}" onclick="choose(${o.k})" ${st.busy ? 'disabled' : ''}><b>${'ABCD'[x]}.</b> ${esc(o.t)}</button>`).join('')}
    ${st.err ? `<div class="err">${esc(st.err)}</div>` : ''}
    <div class="nav"><span class="mut" style="font-size:.85rem;align-self:center">Time is limited. You cannot go back.</span>
    ${st.i < n - 1 ? '<button class="go" onclick="go(1)">Next →</button>' : `<button class="go" onclick="submit()" ${st.busy ? 'disabled' : ''}>${st.busy ? 'Submitting…' : 'Submit quiz'}</button>`}</div></div>`;
  } else if (st.view === 'done') {
    $.innerHTML = `<div class="card done"><div class="big">✅</div><h1>Response submitted</h1><p>Thank you, <b>${esc(st.name)}</b> (${esc(st.reg)}).<br>Your answers have been recorded. Your marks will be shared by your staff.</p><button class="sec" onclick="open_('home')">Back to all quizzes</button></div>`;
  } else if (st.view === 'staff') {
    if (!sf.ok) { $.innerHTML = `<button class="back" onclick="open_('home')">← All quizzes</button><h1>Staff login</h1><div class="card"><p class="mut">Enter the staff password to view student marks.</p>
      <div class="row"><input id="pw" type="password" placeholder="Staff password" value="${esc(sf.pw)}" onkeydown="if(event.key==='Enter')staffLoad()"><button class="go" onclick="staffLoad()" ${sf.busy ? 'disabled' : ''}>${sf.busy ? 'Checking…' : 'View results'}</button></div>
      ${sf.err ? `<div class="err">${esc(sf.err)}</div>` : ''}</div>`; return; }
    const f = sfRows(), avg = f.length ? (f.reduce((a, r) => a + r.score, 0) / f.length).toFixed(2) : '–', tot = f.length ? f[0].total : 0;
    $.innerHTML = `<button class="back" onclick="open_('home')">← All quizzes</button><h1>Staff results</h1><div class="card">
    <div class="row" style="margin-bottom:10px"><select onchange="sfQuiz(this.value)" aria-label="Quiz">${Object.keys(QUIZZES).map(k => `<option value="${k}" ${k === sf.qz ? 'selected' : ''}>${esc(QUIZZES[k].name)}</option>`).join('')}</select></div>
    <div class="stats"><div><b>${f.length}</b><span class="mut">students</span></div><div><b>${avg}${tot ? ' / ' + tot : ''}</b><span class="mut">average marks</span></div><div><b>${f.length ? Math.max(...f.map(r => r.score)) : '–'}</b><span class="mut">highest</span></div></div>
    <div class="row"><input id="sq" placeholder="Search name or register no." value="${esc(sf.q)}" oninput="sfSearch(this.value)" style="flex:1;min-width:200px"><button class="sec" onclick="staffLoad()">↻ Refresh</button><button class="go" onclick="sfXlsx()" ${f.length ? '' : 'disabled'}>⬇ Download Excel</button></div>
    ${sf.err ? `<div class="err">${esc(sf.err)}</div>` : ''}${sf.warn ? `<div class="err">${esc(sf.warn)}</div>` : ''}</div>
    <div class="card tw"><table><thead><tr><th>#</th><th>Name</th><th>Register No.</th><th class="n">Marks</th><th>Submitted</th></tr></thead><tbody>
    ${f.map((r, i) => `<tr><td>${i + 1}</td><td>${esc(r.name)}</td><td>${esc(r.reg)}</td><td class="n"><b>${r.score}</b> / ${r.total}</td><td class="mut">${esc(r.time)}</td></tr>`).join('') || '<tr><td colspan="5" class="mut">No submissions yet for this quiz.' + (sf.rows.length ? ' (' + sf.rows.length + ' result(s) exist for the other quiz.)' : '') + '</td></tr>'}</tbody></table></div>`;
  }
}
/* ---- screenshot / copy deterrents (active only while a quiz is running) ---- */
const inQuiz = () => st.view === 'quiz';
const hideQ = on => document.body.classList.toggle('hide', on && inQuiz());
let capT = 0;
function flash(ms) { hideQ(true); clearTimeout(capT); capT = setTimeout(() => { if (document.hasFocus() && !document.hidden) hideQ(false); }, ms); }
function watermark() {
  const x = t => String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));
  const txt = x((st.name || '') + ' · ' + (st.reg || ''));
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="300" height="170"><text x="150" y="85" text-anchor="middle" transform="rotate(-25 150 85)" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="rgb(120,120,120)" fill-opacity="0.38">' + txt + '</text></svg>';
  document.getElementById('wm').style.backgroundImage = 'url("data:image/svg+xml;utf8,' + encodeURIComponent(svg) + '")';
}
function secure() { document.body.classList.toggle('secure', inQuiz()); if (inQuiz()) watermark(); if (!inQuiz()) hideQ(false); }
['contextmenu', 'copy', 'cut', 'paste', 'dragstart', 'selectstart'].forEach(t => document.addEventListener(t, e => { if (inQuiz()) e.preventDefault(); }));
let away = false, muteAway = false, toastT = 0;
function toast(m) { const e = document.getElementById('toast'); e.textContent = m; e.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(() => { e.style.display = 'none'; }, 4000); }
function leave() {
  if (!inQuiz() || away || muteAway || st.busy) return;
  away = true; st.leaves = (st.leaves || 0) + 1;
  st.deadline -= LEAVE_PENALTY * 1000;   // time penalty
  hideQ(true);
}
function back() {
  if (document.hidden || !document.hasFocus()) return;
  const was = away; away = false; hideQ(false);
  if (was && inQuiz()) { toast('You left the quiz window: ' + LEAVE_PENALTY + ' seconds deducted (' + st.leaves + ' time' + (st.leaves > 1 ? 's' : '') + ').'); tickT(); }
}
window.addEventListener('blur', leave);
window.addEventListener('focus', back);
document.addEventListener('visibilitychange', () => document.hidden ? leave() : back());
window.addEventListener('pagehide', leave);
function onKey(e) {
  if (!inQuiz()) return;
  const k = (e.key || '').toLowerCase(), c = e.ctrlKey || e.metaKey;
  if (k === 'printscreen' || k === 'snapshot' || e.code === 'PrintScreen') {
    try { navigator.clipboard.writeText(' '); } catch (x) {}
    flash(2500); e.preventDefault(); return;
  }
  if (e.metaKey && e.shiftKey && (k === 's' || k === '3' || k === '4' || k === '5')) { flash(2500); e.preventDefault(); return; }
  if (k === 'f12' || (c && e.shiftKey && ['i', 'j', 'c', 's'].includes(k)) || (c && ['p', 's', 'u', 'c', 'x', 'a'].includes(k))) { e.preventDefault(); if (k === 'p') flash(1500); }
}
document.addEventListener('keydown', onKey, true);
document.addEventListener('keyup', onKey, true);
const first = fromHash(); if (first !== 'home') open_(first); else render();
</script></body></html>
