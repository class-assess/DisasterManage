<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UHV II Quiz</title>
<style>
:root{--bg:#f5f7fa;--card:#fff;--ink:#1c2733;--mut:#5d6b7a;--ac:#0f5ea8;--acs:#e6f0fa;--ok:#2e7d4f;--no:#b3261e;--ln:#d9e0e8}
@media (prefers-color-scheme:dark){:root{--bg:#0f1720;--card:#18222e;--ink:#e8eef5;--mut:#9aa9b8;--ac:#5aa9f0;--acs:#1d3248;--ok:#5fc08a;--no:#ff8a80;--ln:#2b3a4a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:680px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.5rem;margin:.2em 0}.mut{color:var(--mut)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:20px;margin:14px 0}
label{display:block;font-weight:600;margin:14px 0 6px}
input[type=text]{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--ink);font:inherit}
input[type=text]:focus{outline:2px solid var(--ac);border-color:transparent}
button{font:inherit;cursor:pointer}
.go{padding:12px 22px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-weight:700}
.go:disabled{opacity:.5;cursor:not-allowed}
.sec{padding:11px 18px;border-radius:10px;border:1px solid var(--ln);background:var(--card);color:var(--ink)}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--ink)}
.opt:hover{border-color:var(--ac)}.opt.sel{border-color:var(--ac);background:var(--acs);font-weight:600}
.bar{height:6px;border-radius:3px;background:var(--ln);margin:8px 0 2px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);transition:width .25s}
.top{display:flex;justify-content:space-between;font-size:.9rem;color:var(--mut)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.dots button{width:32px;height:32px;border-radius:8px;border:1px solid var(--ln);background:var(--card);color:var(--ink);font-size:.8rem}
.dots button.a{background:var(--acs);border-color:var(--ac)}.dots button.c{outline:2px solid var(--ac)}
.err{color:var(--no);margin:10px 0;font-weight:600}.warn{padding:10px 12px;border-radius:10px;background:#fff3cd;color:#5c4400;margin:12px 0}
.done{text-align:center;padding:30px 10px}.done .big{font-size:3rem}
</style></head><body><main id="app"></main>
<script>
/* ================= SETTINGS ================= */
const API_URL = "https://script.google.com/macros/s/AKfycbzkq0dIFyJtkOeyaSRVgpu2gBBCvdjRrTg2jbJUA5M-eFFuAxhWo6uIXmibaapPQqPK6Q/exec";   // see SETUP.md
const QUIZ_TITLE = "UHV II Quiz";
const QUESTIONS_PER_STUDENT = 40;   // number of questions each student gets (max 40); order is always random
/* ============================================ */
const BANK = [{"id": "U01", "q": "A pond contains water, algae, fish and a fisherman. Which option classifies these units into the correct orders (in the same sequence)?", "o": ["Physical, Bio, Human, Animal", "Physical, Bio, Animal, Human", "Physical, Animal, Bio, Human", "Bio, Physical, Animal, Human"]}, {"id": "U02", "q": "Analysing the four orders, which statement correctly differentiates them by what they are made of?", "o": ["Only the physical order is material; the other three consist of consciousness alone", "Physical, bio and animal orders are purely material, while only the human order has consciousness", "Physical and bio orders are purely material, while animal and human orders are each a co-existence of the Self (consciousness) and a material body", "All four orders are co-existence of the Self and a body"]}, {"id": "U03", "q": "Examine the relationship among the four orders. What is the key difference between the human order and the other three?", "o": ["The first three orders exploit the human order, which is why humans have to dominate them", "All four orders are already fulfilling for each other without any exception", "The human order is not part of nature, so it has no relationship with the other three", "The first three orders already enrich the human being, but the human being currently dominates and exploits them instead of enriching them"]}, {"id": "U04", "q": "A person says, “I want to enrich nature,” yet cuts down a forest for personal convenience. Which analysis best explains this contradiction?", "o": ["Nature itself is meant to be exploited by the human order", "Natural acceptance changes from person to person, so he actually wants to exploit nature", "His natural acceptance is to enrich, but his conduct runs on assuming without knowing, i.e. without right understanding, so it contradicts his acceptance", "His statement is false because no human being has a natural acceptance to enrich nature"]}, {"id": "U05", "q": "Which of the following is an example of mutual fulfilment between the physical order and the bio order?", "o": ["Soil nourishes plants, and plants hold and enrich the soil", "A farmer harvesting a crop", "A lion hunting a deer", "Birds carrying seeds from one place to another"]}, {"id": "U06", "q": "A dead animal decays and makes the soil fertile; the fertile soil supports new plants; the plants feed other animals. What can be inferred from this chain?", "o": ["The chain proves that the physical order depends on nothing", "Animals are unnecessary for the soil and plants", "The orders are interconnected in a cycle where what one order gives back becomes the enrichment of another", "Only the animal order benefits from the chain"]}, {"id": "U07", "q": "Which inference is valid from the sequence Physical order ≫ Bio order ≫ Animal order ≫ Human order in terms of quantity?", "o": ["Since the animal order is smaller than the bio order, animals are not needed in nature", "Human beings are the most abundant, so they must regulate the other orders", "The quantity of each order is random and has no relationship with the others", "Nature is organised so that the requirement of every order is already available in abundance"]}, {"id": "U08", "q": "Which statement best explains why a forest stays in balance without any human regulation?", "o": ["The lions deliberately decide how many deer to eat", "Human beings continuously control the number of animals and plants", "The proportion of soil, plants and animals of various species is self-regulated within nature itself", "The forest stays in balance only because plants grow without any limit"]}, {"id": "U09", "q": "A manager removes all the predators from a forest to ‘protect’ the deer. Based on the idea of self-regulation in nature, what is the most likely concern?", "o": ["The soil will immediately turn into plants", "The deer will become members of the human order", "Nothing will change because forests need human regulation anyway", "The proportion among species that nature had self-regulated gets disturbed, so human regulation ends up breaking the harmony"]}, {"id": "U10", "q": "Compare self-regulation in a forest with the human being. Which comparison is correct as per the handout?", "o": ["A forest is already self-regulated, while the human being too can become self-organised and in harmony within, with right understanding", "Neither a forest nor a human being can be self-regulated", "A forest needs human regulation, while the human being is always self-regulated", "The human being is self-regulated only through external control by others"]}, {"id": "U11", "q": "Which scenario shows self-regulation in nature rather than external regulation?", "o": ["A government department limits the number of trees that can be cut", "A farmer decides how much water each plant gets", "In a forest, deer never eat up all the grass and lions never eat up all the deer, with no one managing it", "A zoo keeper decides the diet of caged animals"]}, {"id": "U12", "q": "If plants disappear completely from a region, which analysis is most complete according to the idea of interconnectedness?", "o": ["Nothing changes, as the physical order is independent of all other orders", "Animals lose their food, the soil loses its mutually fulfilling partner, and the other orders in the region are affected as well", "Only the bio order is affected, because the orders are not related to each other", "Only the human order is affected, as other orders do not depend on plants"]}, {"id": "U13", "q": "A scientist claims that building ever-better machines will give permanent development in the material world. Which analysis from the handout challenges this claim?", "o": ["Whatever is done with the material world is cyclic and keeps returning to its initial state, so lasting development is possible only in the Self", "Development is possible only if the number of machines is increased", "The material world develops in a straight line, but too slowly to observe", "Material units are continuous, so they never change"]}, {"id": "U14", "q": "Which of the following represents a cyclic process in nature?", "o": ["Animal dung and dead bodies enrich the soil, the soil nourishes plants, and plants feed animals", "A human being developing right understanding and right feeling in the Self", "Space being unlimited and all-pervading", "Units being energised in space"]}, {"id": "U15", "q": "A body decays after death, yet the Self is said to continue. Which statement correctly distinguishes the two kinds of units?", "o": ["Both are temporary in time", "Both are cyclic and return to an initial state", "Material units are continuous, while the Self is temporary", "Material units are temporary in time and cyclic, while consciousness units (the Self) are continuous"]}, {"id": "U16", "q": "Why is real, permanent development possible only in the human order and not in the material world?", "o": ["Because the human body is made of more matter than the other orders", "Because material units keep developing in a straight line", "Permanent change is possible only in the domain of consciousness, through right understanding and right feeling in the Self", "Because the human order is the only order that exists in space"]}, {"id": "U17", "q": "A community composts its kitchen waste and returns it to the soil to grow plants. Which idea from the handout does this best reflect?", "o": ["The idea that material units are continuous and never change", "The idea that the human order is separate from nature", "The idea that space itself carries out the activity", "The cyclic nature of material units and the mutual fulfilment among the orders, where the output of one becomes the enrichment of another"]}, {"id": "U18", "q": "Which pair of statements correctly distinguishes units from space?", "o": ["Space is active, whereas units are passive and boundaryless", "Units are limited in size and are activity; space is unlimited and is no-activity", "Both units and space are limited in size and active", "Units are unlimited and no-activity; space is limited and active"]}, {"id": "U19", "q": "A student says, “Space is the most active reality because it holds everything.” Identify the flaw in this statement.", "o": ["Units do not need space, so space is irrelevant to activity", "Space is a unit and therefore must be active", "Space is no-activity; all activity takes place only in the units", "Space has a definite size, so it cannot hold everything"]}, {"id": "U20", "q": "A student claims that inside a solid stone there is no space at all. Which concept from the handout shows the flaw?", "o": ["Units are unlimited, so they replace space", "Space is a unit of the physical order", "Space is limited in size, so it cannot enter units", "Submergence: units are inseparable from space, and wherever a unit is, space is also there"]}, {"id": "U21", "q": "Even the smallest atom and the largest planet are active. Which quality of units, arising from their co-existence with space, explains this?", "o": ["Every unit is energised in space", "Every unit is made of lumps and fluids", "Every unit is a consciousness unit", "Every unit is limited in activity by space"]}, {"id": "U22", "q": "Water always freezes and boils in a definite way, which is why we can recognise and study it. Which quality of units explains this?", "o": ["Being a consciousness unit, water decides its conduct each time", "Being no-activity, water simply stays unchanged", "Being unlimited in size, water has no definite conduct", "Being self-organised in space, the unit is in a definite order and shows a definite conduct"]}, {"id": "U23", "q": "Why is the conduct of a stone definite, while the conduct of a human being can be indefinite?", "o": ["A material unit fulfils its relationships in a definite way, while the human Self can act by assuming without knowing and so become indefinite", "Human beings are not in space, so their conduct is uncertain", "Stones have consciousness and human beings do not", "Stones are energised but human beings are not"]}, {"id": "U24", "q": "Which statement best differentiates ‘existence’ from the idea of ‘co-existence’ as used in the handout?", "o": ["Existence refers only to units, and space does not exist", "Existence refers only to space, and units are separate from it", "Co-existence means that the human order exists alone, away from space", "Existence is whatever exists, and it is in the form of co-existence, i.e. units submerged in space"]}, {"id": "U25", "q": "A student says, “I can live and exist independently of everyone else.” Which analysis from the handout shows the flaw?", "o": ["Only material units are related to each other; human beings are not", "Relationships exist only in space, and human beings are not in space", "Every unit is in co-existence and recognises and fulfils its relationship with every other unit in space, so no unit exists in isolation", "Units are related to others only when they are in the same order"]}, {"id": "U26", "q": "Which sequence correctly shows how complex material units are composed from simpler ones?", "o": ["Atom → molecule → molecular structure (lump or fluid) → cells → plant, animal and human bodies", "Plant body → cells → molecule → atom → lump", "Cells → atom → molecule → plant, animal and human bodies", "Molecular structure → atom → cells → molecule → body"]}, {"id": "U27", "q": "Two managers handle a conflict. Manager A acts on assuming based on knowing, whereas Manager B acts on assuming without knowing. What is the likely difference?", "o": ["A's conduct will be indefinite, whereas B's will be definite", "Both will show equally definite conduct", "A's conduct will be definite, whereas B's conduct will be indefinite", "Neither will show any conduct, as the Self is no-activity"]}, {"id": "U28", "q": "Which sequence correctly describes the two parts of development in the Self?", "o": ["Dominating the other orders, then developing right feeling", "Producing more material goods, then storing them", "Living without any thought, then developing right understanding", "Developing right understanding and right feeling, then living accordingly in desires, thoughts, behaviour, work and participation"]}, {"id": "U29", "q": "A school trains students only in skills to produce more material goods. Which analysis from the handout shows why this is inadequate for development?", "o": ["Development comes automatically, without any education", "Material change is cyclic, whereas real development is in the Self through right understanding and right feeling, facilitated by education-sanskar", "Only animals need education-sanskar, not human beings", "Material goods are continuous, so they cannot help development"]}, {"id": "U30", "q": "Which match of the level and its expression of co-existence is correct?", "o": ["Existence – feeling of trust; Family – units in space", "Nature – mutual fulfilment; Existence – co-existence", "Family – mutual fulfilment; Nature – trust and respect", "Nature – co-existence; Existence – mutual fulfilment"]}, {"id": "U31", "q": "How are harmony in the individual, family, society and nature related to existence?", "o": ["They are the cause of existence, not its expression", "They are systematic expressions of existence as co-existence at different levels", "They are four unrelated types of harmony", "They exist independently of co-existence"]}, {"id": "U32", "q": "A student concludes that ‘value’ means personal gain from others. Which correction fits the handout?", "o": ["Value means making other orders follow the human being", "Value is a unit's participation in the larger order, and the human being's value is to realise co-existence and live in it", "Value is whatever a human being can extract from nature", "Value is limited to the human order and has nothing to do with nature"]}, {"id": "U33", "q": "A student notices every day that his desires conflict with his natural acceptance and then corrects them. Which two components of the programme of action is he practising?", "o": ["Self-exploration only, with no awareness", "Self-awareness and self-evaluation", "Dominating others and gathering facilities", "Self-promotion and self-defence"]}, {"id": "U34", "q": "Which of the following is an example of self-exploration rather than blind belief?", "o": ["Memorising the proposals for an examination", "Verifying the proposals on one's own natural acceptance and living accordingly", "Accepting a proposal because a teacher said it", "Rejecting a proposal without ever verifying it"]}, {"id": "U35", "q": "Why does the handout treat ‘universal human order’ and ‘universal order’ as synonymous?", "o": ["Because universal order is separate from co-existence", "Because the other three orders are replaced by the human order", "Because the human order is the only order that exists", "Because the unfolding of co-existence is completed through the human being, whose completion is the universal human order"]}, {"id": "U36", "q": "Why would a value-based programme of education-sanskar shorten the time needed to develop right understanding in society?", "o": ["Because it removes the need for self-exploration", "Because it replaces the Self with material facilities", "Because it reduces the number of people in society", "Because right understanding becomes a definite component of the system of society rather than depending on individuals alone"]}, {"id": "U37", "q": "Which analysis of global warming and climate change is consistent with the handout?", "o": ["It is the result of the human order dominating and exploiting the other three orders, not a failure of nature's own harmony", "It shows that physical order is unnecessary for the human being", "It shows that the animal order is dominating the human order", "It shows that nature is not self-regulated and needs more exploitation"]}, {"id": "U38", "q": "A speaker argues, “Humans are the most important, so the other orders exist only for us.” Which analysis shows why this is inconsistent with the handout?", "o": ["The human order is the largest in quantity, so it must be dominated", "Animals and plants have decided that humans are not important", "The other three orders are not related to the human order at all", "The human order is part of nature and depends on the other three, which exist in far greater quantity; the relationship is of mutual fulfilment, not domination"]}, {"id": "U39", "q": "Birds eat fruits and spread the seeds, and also protect plants from harmful insects. What does this show about the relationship between the animal and bio orders?", "o": ["It shows that the two orders are unrelated", "It is one-sided: only the bio order benefits", "It is one-sided: only the animal order benefits", "It is mutual: animals depend on plants for food and in turn enrich plants"]}, {"id": "U40", "q": "Which statement best integrates the holistic perception of harmony at all levels of existence?", "o": ["Each order exists in isolation, and harmony arises only inside the human being", "Space is active and units are passive, and harmony is created by human regulation", "Existence is only a collection of material units, and the human being needs to dominate them", "Existence is co-existence of units submerged in space; units are energised, self-organised and relational, and the human being's role is to realise and live in co-existence"]}];
const $ = document.getElementById('app');
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let st = { view: 'start', name: '', reg: '', qs: [], i: 0, ans: {}, err: '', busy: false };
let started = 0;

function begin() {
  const name = document.getElementById('nm').value.trim().replace(/\s+/g, ' ');
  const reg = document.getElementById('rg').value.trim().toUpperCase().replace(/\s+/g, '');
  if (name.length < 2) { st.err = 'Please enter your full name.'; return render(); }
  if (!/^[A-Z0-9\-\/]{4,20}$/.test(reg)) { st.err = 'Please enter a valid register number (letters and digits only).'; return render(); }
  const n = Math.min(QUESTIONS_PER_STUDENT, BANK.length);
  // random question order, and random option order for every student
  st.qs = shuffle(BANK).slice(0, n).map(q => ({ id: q.id, q: q.q, opts: shuffle(q.o.map((t, k) => ({ t, k }))) }));
  Object.assign(st, { name, reg, i: 0, ans: {}, err: '', view: 'quiz' });
  started = Date.now(); render();
}
function choose(k) { st.ans[st.qs[st.i].id] = k; render(); }
function go(d) { st.i = Math.max(0, Math.min(st.qs.length - 1, st.i + d)); render(); }
function jump(i) { st.i = i; render(); }
async function submit() {
  const left = st.qs.length - Object.keys(st.ans).length;
  if (left > 0 && !confirm(left + ' question(s) are unanswered. Submit anyway?')) return;
  if (left === 0 && !confirm('Submit your answers? You cannot retake the quiz.')) return;
  st.busy = true; st.err = ''; render();
  try {
    const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'submit', name: st.name, reg: st.reg, answers: st.ans, total: st.qs.length, quiz: 'UHV' }) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'Submission failed');
    st.view = 'done';
  } catch (e) { st.err = 'Could not submit: ' + e.message + '. Check your internet connection and press Submit again.'; }
  st.busy = false; render();
}
function render() {
  const notSet = API_URL.indexOf('PASTE_') === 0;
  if (st.view === 'start') {
    $.innerHTML = `<h1>${QUIZ_TITLE}</h1><p class="mut">Understanding harmony in nature and existence: the four orders, mutual fulfilment, self-regulation, co-existence and holistic perception.</p>
    <div class="card"><label for="nm">Full name</label><input id="nm" type="text" autocomplete="off" value="${esc(st.name)}">
    <label for="rg">Register number</label><input id="rg" type="text" autocomplete="off" value="${esc(st.reg)}">
    ${st.err ? `<div class="err">${esc(st.err)}</div>` : ''}
    ${notSet ? '<div class="warn">Setup not finished: the Apps Script URL has not been added in index.html (see SETUP.md).</div>' : ''}
    <ul class="mut"><li>${Math.min(QUESTIONS_PER_STUDENT, BANK.length)} multiple-choice questions, shown in random order.</li><li>You can move back and forth before submitting.</li><li>You can attempt the quiz only once. Your marks will be shared by your staff.</li></ul>
    <button class="go" onclick="begin()" ${notSet ? 'disabled' : ''}>Start quiz</button></div>`;
  } else if (st.view === 'quiz') {
    const q = st.qs[st.i], n = st.qs.length, done = Object.keys(st.ans).length;
    $.innerHTML = `<div class="top"><span>${esc(st.name)} · ${esc(st.reg)}</span><span>${done}/${n} answered</span></div>
    <div class="bar"><i style="width:${(st.i + 1) / n * 100}%"></i></div>
    <div class="card"><div class="mut" style="font-size:.85rem">Question ${st.i + 1} of ${n}</div><p style="font-size:1.1rem;font-weight:600">${esc(q.q)}</p>
    ${q.opts.map((o, x) => `<button class="opt ${st.ans[q.id] === o.k ? 'sel' : ''}" onclick="choose(${o.k})"><b>${'ABCD'[x]}.</b> ${esc(o.t)}</button>`).join('')}
    ${st.err ? `<div class="err">${esc(st.err)}</div>` : ''}
    <div class="nav"><button class="sec" onclick="go(-1)" ${st.i === 0 ? 'disabled' : ''}>← Previous</button>
    ${st.i < n - 1 ? '<button class="go" onclick="go(1)">Next →</button>' : `<button class="go" onclick="submit()" ${st.busy ? 'disabled' : ''}>${st.busy ? 'Submitting…' : 'Submit quiz'}</button>`}</div>
    <div class="dots">${st.qs.map((x, j) => `<button class="${st.ans[x.id] !== undefined ? 'a' : ''} ${j === st.i ? 'c' : ''}" onclick="jump(${j})" aria-label="Question ${j + 1}">${j + 1}</button>`).join('')}</div>
    ${st.i < n - 1 ? `<div style="margin-top:14px"><button class="sec" onclick="submit()" ${st.busy ? 'disabled' : ''}>Submit now</button></div>` : ''}</div>`;
  } else {
    $.innerHTML = `<div class="card done"><div class="big">✅</div><h1>Response submitted</h1><p>Thank you, <b>${esc(st.name)}</b> (${esc(st.reg)}).<br>Your answers have been recorded. Your marks will be shared by your staff.</p></div>`;
  }
}
render();
</script></body></html>
